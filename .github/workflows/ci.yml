name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_APP: /Applications/Xcode_16.2.app

jobs:
  lint:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          test -d "$XCODE_APP" || { echo "Missing $XCODE_APP"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$XCODE_APP"
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m
      - name: Guard Swift version
        run: swift --version 2>&1 | grep -q "Swift version 6.0"
      - name: Lint
        run: ./Scripts/lint.sh
      - name: Concurrency escape hatches
        run: ./Scripts/check-concurrency.sh
      - name: Documentation catalog check
        run: ./Scripts/check-docs.sh
      - name: Threat model check
        run: ./Scripts/check-threat-model.sh
      - name: Examples check
        run: ./Scripts/check-examples.sh
      - name: Public API check
        run: ./Scripts/check-public-api.sh
      - name: Error guide check
        run: ./Scripts/check-errors-doc.sh

  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          test -d "$XCODE_APP" || { echo "Missing $XCODE_APP"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$XCODE_APP"
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m
      - name: Guard Swift version
        run: swift --version 2>&1 | grep -q "Swift version 6.0"
      - name: Build
        run: swift build
      - name: Test
        run: swift test --skip BiometricSessionPerfTests

  ios-build:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and Simulator SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Build package for iOS Simulator
        run: |
          xcodebuild build \
            -scheme BiometricSession-Package \
            -destination 'generic/platform=iOS Simulator'

  ios-test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and eligible destinations
        run: |
          xcodebuild -version
          xcodebuild -scheme BiometricSession-Package -showdestinations
      - name: Test UIKit adapter on iOS Simulator
        run: |
          xcodebuild test \
            -scheme BiometricSession-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -only-testing:BiometricSessionUIKitTests

  docs:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build documentation
        run: ./Scripts/docbuild.sh

  ios-demo:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build demo for iOS Simulator
        run: |
          xcodebuild build \
            -project Examples/BiometricSessionDemo/BiometricSessionDemo.xcodeproj \
            -scheme BiometricSessionDemo \
            -destination 'generic/platform=iOS Simulator'
